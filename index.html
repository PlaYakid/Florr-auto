<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>星际闪避 · Star Drift</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080c19;color:#ecf3ff;font:16px system-ui,-apple-system,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}
main{width:min(960px,100%)}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.eyebrow{font-size:11px;letter-spacing:4px;color:#73eadb}h1{font-size:32px;margin:6px 0;font-weight:800}h1 span{color:#6a779b;font-size:14px;font-weight:400;margin-left:10px}.stats{display:flex;gap:24px}.stat small{display:block;color:#8794b2;font-size:12px;margin-bottom:5px}.stat b{font-size:24px;font-variant-numeric:tabular-nums}
.arena{position:relative;border:1px solid #263455;border-radius:22px;overflow:hidden;background:#0d1427;box-shadow:0 24px 100px #0006}canvas{display:block;width:100%;aspect-ratio:16/10;touch-action:none}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:#080c197d;backdrop-filter:blur(5px)}.overlay[hidden]{display:none}.badge{color:#80f5dc;border:1px solid #80f5dc44;border-radius:40px;padding:7px 14px;font-size:12px;letter-spacing:2px}h2{font-size:clamp(28px,5vw,52px);margin:20px 0 10px}.overlay p{color:#b0bed8;line-height:1.8;margin:0 0 24px;max-width:440px}
button{border:0;background:#7bf3d8;color:#071c24;border-radius:12px;padding:14px 26px;font:700 16px system-ui;cursor:pointer}button:hover{background:#a9ffe9}button:focus-visible{outline:3px solid #fff;outline-offset:4px}
footer{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:16px;color:#8c9ab7;font-size:13px}#pause{background:#17213a;color:#c2cde4;padding:9px 16px;font-size:13px}#pause:disabled{opacity:.4;cursor:default}kbd{color:#d7e5ff;font:inherit}.tip{margin:18px 0 0;color:#62718f;font-size:12px;text-align:center}
@media(max-width:560px){body{padding:14px}h1{font-size:24px}h1 span{display:none}.stats{gap:14px}.stat b{font-size:20px}canvas{aspect-ratio:3/4}footer{font-size:11px}.overlay p{font-size:14px}}
</style>
</head>
<body>
<main>
<header><div><div class="eyebrow">ORBIT ARCADE / 01</div><h1>星际闪避 <span>STAR DRIFT</span></h1></div><div class="stats"><div class="stat"><small>本次得分</small><b id="score">0</b></div><div class="stat"><small>最高纪录</small><b id="best">0</b></div></div></header>
<div class="arena">
<canvas id="game" width="960" height="600" aria-label="星际闪避游戏区域，使用方向键或 WASD 移动飞船，也可以拖动触控。"></canvas>
<div class="overlay" id="overlay"><span class="badge" id="badge">准备好进入星海了吗？</span><h2 id="title">向星光出发。</h2><p id="description">躲开陨石，收集金色星星。<br>坚持得越久，星海的挑战就越大。</p><button id="start">开始航行 →</button></div>
</div>
<footer><span><kbd>WASD / 方向键</kbd> 移动 · 拖动屏幕操控 · <kbd>P</kbd> 暂停</span><button id="pause" disabled>暂停</button></footer>
<p class="tip">每颗星星 +50 分 · 生存每秒 +10 分 · 无需联网，随时来一局</p>
</main>
<script>
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const ui=Object.fromEntries(['score','best','overlay','badge','title','description','start','pause'].map(id=>[id,document.getElementById(id)]));
let best=0;try{best=Math.max(0,Number(localStorage.getItem('star-drift-best'))||0)}catch(e){}
ui.best.textContent=Math.floor(best);
let state='ready',elapsed=0,points=0,spawn=0,starTimer=0,rocks=[],stars=[],sparks=[],last=0;
const player={x:480,y:480,r:15},keys=new Set();
let pointer=null;
const background=Array.from({length:90},()=>({x:Math.random()*960,y:Math.random()*600,r:Math.random()*1.6+.4,s:Math.random()*25+10}));
function show(title,description,label,badge){ui.title.textContent=title;ui.description.textContent=description;ui.start.textContent=label;ui.badge.textContent=badge;ui.overlay.hidden=false}
function start(){state='playing';elapsed=0;points=0;spawn=.5;starTimer=.7;rocks=[];stars=[];sparks=[];keys.clear();pointer=null;player.x=480;player.y=480;ui.score.textContent='0';ui.overlay.hidden=true;ui.pause.disabled=false;ui.pause.textContent='暂停'}
function togglePause(){if(state==='playing'){state='paused';keys.clear();pointer=null;show('稍作停留。','准备好后，继续你的星际旅程。','继续航行 →','航行已暂停');ui.pause.textContent='继续'}else if(state==='paused'){state='playing';ui.overlay.hidden=true;ui.pause.textContent='暂停'}}
function finish(){state='over';pointer=null;keys.clear();const score=Math.floor(points);if(score>best){best=score;try{localStorage.setItem('star-drift-best',String(best))}catch(e){}}ui.best.textContent=best;ui.pause.disabled=true;show('下一次，再远一点。','本次获得 '+score+' 分，飞行了 '+Math.floor(elapsed)+' 秒。','再来一局 →','本次航行结束')}
ui.start.addEventListener('click',()=>state==='paused'?togglePause():start());
ui.pause.addEventListener('click',togglePause);
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d','p'].includes(k)){e.preventDefault();if(k==='p'){if(!e.repeat)togglePause()}else if(state==='playing')keys.add(k)}});
window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
window.addEventListener('blur',()=>{keys.clear();if(state==='playing')togglePause()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')togglePause()});
function aim(e){const r=canvas.getBoundingClientRect();pointer={x:(e.clientX-r.left)*960/r.width,y:(e.clientY-r.top)*600/r.height}}
canvas.addEventListener('pointerdown',e=>{if(state==='playing'){canvas.setPointerCapture(e.pointerId);aim(e)}});
canvas.addEventListener('pointermove',e=>{if(canvas.hasPointerCapture(e.pointerId)&&state==='playing')aim(e)});
for(const type of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(type,()=>pointer=null);
function burst(x,y){for(let i=0;i<14;i++){const a=Math.random()*Math.PI*2,s=Math.random()*130+40;sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.6})}}
function update(dt){
 elapsed+=dt;points+=dt*10;spawn-=dt;starTimer-=dt;
 let dx=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0),dy=(keys.has('s')||keys.has('arrowdown')?1:0)-(keys.has('w')||keys.has('arrowup')?1:0);
 if(pointer){const x=pointer.x-player.x,y=pointer.y-player.y,d=Math.hypot(x,y),step=Math.min(d,440*dt);if(d){player.x+=x/d*step;player.y+=y/d*step}}else{const d=Math.hypot(dx,dy)||1;player.x+=dx/d*360*dt;player.y+=dy/d*360*dt}
 player.x=Math.max(20,Math.min(940,player.x));player.y=Math.max(24,Math.min(578,player.y));
 const difficulty=Math.min(elapsed/30,5);
 if(spawn<=0){const r=16+Math.random()*20;rocks.push({x:r+Math.random()*(960-2*r),y:-50,r,v:125+difficulty*34+Math.random()*75,angle:Math.random()*6,spin:Math.random()*2-1,shape:Array.from({length:9},()=>.8+Math.random()*.2)});spawn=Math.max(.18,.7-difficulty*.09)}
 if(starTimer<=0){stars.push({x:30+Math.random()*900,y:-20,r:11,v:115});starTimer=1.2+Math.random()*.8}
 for(const rock of rocks){rock.y+=rock.v*dt;rock.angle+=rock.spin*dt;if(Math.hypot(rock.x-player.x,rock.y-player.y)<rock.r*.85+player.r){finish();return}}
 for(const star of stars){star.y+=star.v*dt;if(!star.taken&&Math.hypot(star.x-player.x,star.y-player.y)<star.r+player.r+4){star.taken=true;points+=50;burst(star.x,star.y)}}
 rocks=rocks.filter(o=>o.y<660);stars=stars.filter(o=>o.y<630&&!o.taken);
 for(const p of sparks){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}sparks=sparks.filter(p=>p.life>0);
 ui.score.textContent=Math.floor(points);
}
function draw(time){
 ctx.fillStyle='#0d1427';ctx.fillRect(0,0,960,600);
 const glow=ctx.createRadialGradient(480,210,0,480,210,600);glow.addColorStop(0,'#20335766');glow.addColorStop(1,'#0d142700');ctx.fillStyle=glow;ctx.fillRect(0,0,960,600);
 for(const b of background){ctx.globalAlpha=.35+b.r/3;ctx.fillStyle='#c4ddff';ctx.beginPath();ctx.arc(b.x,(b.y+elapsed*b.s)%600,b.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
 for(const star of stars){ctx.save();ctx.translate(star.x,star.y);ctx.rotate(elapsed);ctx.shadowBlur=18;ctx.shadowColor='#ffdc7d';ctx.fillStyle='#ffdc7d';ctx.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,r=i%2?5:12;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.restore()}
 for(const rock of rocks){ctx.save();ctx.translate(rock.x,rock.y);ctx.rotate(rock.angle);ctx.fillStyle='#3a405c';ctx.strokeStyle='#8b7b96';ctx.lineWidth=2;ctx.beginPath();rock.shape.forEach((v,i)=>{const a=i*Math.PI*2/9;ctx.lineTo(Math.cos(a)*rock.r*v,Math.sin(a)*rock.r*v)});ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#272e46';ctx.beginPath();ctx.arc(-rock.r*.2,-rock.r*.15,rock.r*.22,0,Math.PI*2);ctx.fill();ctx.restore()}
 for(const p of sparks){ctx.globalAlpha=p.life/.6;ctx.fillStyle='#ffe3a0';ctx.fillRect(p.x,p.y,3,3)}ctx.globalAlpha=1;
 ctx.save();ctx.translate(player.x,player.y);ctx.shadowBlur=22;ctx.shadowColor='#68f5df';ctx.fillStyle='#46bdec';ctx.beginPath();ctx.moveTo(-6,12);ctx.lineTo(0,26+Math.sin(time/75)*5);ctx.lineTo(6,12);ctx.fill();ctx.fillStyle='#91ffe5';ctx.beginPath();ctx.moveTo(0,-20);ctx.lineTo(16,16);ctx.lineTo(0,9);ctx.lineTo(-16,16);ctx.closePath();ctx.fill();ctx.fillStyle='#10283f';ctx.beginPath();ctx.moveTo(0,-9);ctx.lineTo(5,6);ctx.lineTo(-5,6);ctx.fill();ctx.restore();
}
function frame(t){const dt=Math.min((t-last)/1000||0,.04);last=t;if(state==='playing')update(dt);draw(t);requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>
</body>
</html>
